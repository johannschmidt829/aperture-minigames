<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Платформер Сортировочной Шляпы</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #14122b;
    font-family: Georgia, 'Times New Roman', serif;
    color: #f4e9c8;
    overflow: hidden;
    touch-action: none;
    user-select: none;
  }
  #wrap {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  #stage {
    position: relative;
    width: min(100vw, calc(100vh * 800 / 450));
    aspect-ratio: 800 / 450;
  }
  canvas {
    display: block; width: 100%; height: 100%;
    border-radius: 10px;
    box-shadow: 0 0 0 2px #6b5a2e, 0 0 40px rgba(180,140,60,.25);
    background: #1b1838;
  }
  #score {
    position: absolute; top: 10px; left: 14px;
    font-size: clamp(13px, 2.3vw, 19px);
    color: #ffe9a8;
    text-shadow: 0 2px 6px #000, 0 0 12px rgba(255,200,80,.5);
    pointer-events: none;
    letter-spacing: .5px;
  }
  #hint {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    font-size: clamp(10px, 1.6vw, 13px);
    color: rgba(244,233,200,.5);
    pointer-events: none; white-space: nowrap;
  }
  /* Touch controls */
  #pad, #jumpBtn { position: absolute; bottom: 4%; display: none; }
  #pad {
    left: 3%; width: 28%; aspect-ratio: 1;
    max-width: 190px;
    border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,.10), rgba(255,255,255,.03) 65%, transparent 70%);
    border: 2px solid rgba(255,220,140,.28);
  }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 42%; aspect-ratio: 1; margin: -21% 0 0 -21%;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffe8a8, #b98c2d 70%, #7a5a15);
    box-shadow: 0 4px 14px rgba(0,0,0,.55), inset 0 -2px 6px rgba(0,0,0,.3);
  }
  #jumpBtn {
    right: 4%; width: 20%; aspect-ratio: 1; max-width: 140px;
    border-radius: 50%;
    border: 2px solid rgba(255,220,140,.45);
    background: radial-gradient(circle at 40% 35%, rgba(255,230,160,.35), rgba(150,105,25,.30) 70%, transparent);
    color: #ffe9a8;
    font-size: clamp(12px, 2.2vw, 18px);
    display: none; align-items: center; justify-content: center;
    font-family: inherit; letter-spacing: 1px;
    text-shadow: 0 2px 6px #000;
  }
  #jumpBtn:active { transform: scale(.93); }
  .touch #pad, .touch #jumpBtn { display: flex; }
  .touch #hint { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="g" width="800" height="450"></canvas>
    <div id="score">Звёзды: 0 / 5</div>
    <div id="hint">Стрелки/A/D — бег · Пробел — прыжок · N — след. уровень · P — назад</div>
    <div id="pad"><div id="knob"></div></div>
    <div id="jumpBtn">↑</div>
  </div>
</div>
<script>
(function () {
  'use strict';

  var canvas = document.getElementById('g');
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height;
  var scoreEl = document.getElementById('score');

  var GRAV = 0.70;
  var MAXFALL = 15;
  var MOVE = 0.95;
  var FRICTION = 0.80;
  var MAXSPEED = 5.2;
  var JUMP = -15.4;

  var LEVEL_COUNT = 200;
  var level = 1;
  var WORLD = 940;
  var maxUnlocked = 1;
  try {
    var ml = parseInt(localStorage.getItem('hat_max') || '1', 10);
    if (ml >= 1 && ml <= LEVEL_COUNT) maxUnlocked = ml;
    var cl = parseInt(localStorage.getItem('hat_level') || '1', 10);
    if (cl >= 1 && cl <= LEVEL_COUNT) level = Math.min(cl, maxUnlocked);
  } catch (e) {}

  var player, plats, stars, score, win, t, camX, sparks = [];
  var theme;

  var keys = { left: false, right: false, jump: false };
  var jumpBuf = 0;
  var jumpWasDown = false;
  var jumpCutDone = false;
  var coyote = 0;

  function seededRand(seed) {
    var s = seed | 0;
    return function () {
      s = s + 0x6D2B79F5 | 0;
      var t = Math.imul(s ^ s >>> 15, 1 | s);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function levelOneLayout() {
    return {
      plats: [
        { x: -40, y: 400, w: 300, h: 60 },
        { x: 340, y: 400, w: 240, h: 60 },
        { x: 660, y: 400, w: 220, h: 60 },
        { x: 120, y: 320, w: 130, h: 18 },
        { x: 320, y: 262, w: 120, h: 18 },
        { x: 510, y: 320, w: 120, h: 18 },
        { x: 700, y: 250, w: 130, h: 18 },
        { x: 180, y: 200, w: 110, h: 18 },
        { x: 400, y: 158, w: 110, h: 18 },
        { x: 600, y: 120, w: 140, h: 18 }
      ],
      stars: [
        { x: 185, y: 280, got: false },
        { x: 380, y: 222, got: false },
        { x: 570, y: 280, got: false },
        { x: 235, y: 160, got: false },
        { x: 455, y: 118, got: false }
      ]
    };
  }

  var THEMES = [
    { name: 'Ночной замок', sky: ['#241f4d', '#1b1838', '#120f26'], plat: ['#6b5a2e', '#4a3d1e', '#2a2212'], edge: 'rgba(255,220,140,.35)', star: '#ffd75a', glow: 'rgba(255,215,90,.9)', sil: 'rgba(10,8,24,.85)', moon: 'rgba(255,246,214,.9)', accent: '#ffe9a8' },
    { name: 'Рассвет', sky: ['#4a2246', '#2e1836', '#1a0f22'], plat: ['#7a4a3a', '#543026', '#2e1a14'], edge: 'rgba(255,180,140,.40)', star: '#ffd06a', glow: 'rgba(255,190,120,.9)', sil: 'rgba(28,10,26,.85)', moon: 'rgba(255,190,150,.9)', accent: '#ffd9b0' },
    { name: 'Запретный лес', sky: ['#14302a', '#0f241f', '#08160f'], plat: ['#3f5a2e', '#2c4020', '#172614'], edge: 'rgba(180,255,150,.30)', star: '#c8ff8a', glow: 'rgba(170,255,140,.9)', sil: 'rgba(6,20,12,.85)', moon: 'rgba(200,255,190,.85)', accent: '#d9ffc0' },
    { name: 'Ледяные залы', sky: ['#1a3a52', '#12283a', '#0a1826'], plat: ['#4a6b7a', '#334c59', '#1c2b33'], edge: 'rgba(180,230,255,.45)', star: '#b8f0ff', glow: 'rgba(160,230,255,.9)', sil: 'rgba(8,20,30,.85)', moon: 'rgba(220,245,255,.9)', accent: '#d6f4ff' },
    { name: 'Багровый зал', sky: ['#3a1020', '#260a16', '#16050c'], plat: ['#7a2a2e', '#54201f', '#2c1010'], edge: 'rgba(255,150,140,.40)', star: '#ffb46a', glow: 'rgba(255,150,110,.9)', sil: 'rgba(24,4,10,.85)', moon: 'rgba(255,170,150,.85)', accent: '#ffd0c0' },
    { name: 'Пустыня', sky: ['#4a3520', '#332314', '#1e1409'], plat: ['#8a6b3a', '#63492a', '#3a2a16'], edge: 'rgba(255,225,150,.45)', star: '#ffe08a', glow: 'rgba(255,215,130,.9)', sil: 'rgba(26,16,6,.85)', moon: 'rgba(255,235,190,.9)', accent: '#ffeec2' },
    { name: 'Аметистовые своды', sky: ['#2e1a4a', '#20102f', '#120a1a'], plat: ['#5a3a7a', '#402a56', '#24162e'], edge: 'rgba(220,170,255,.40)', star: '#e2aaff', glow: 'rgba(210,160,255,.9)', sil: 'rgba(14,6,22,.85)', moon: 'rgba(235,210,255,.9)', accent: '#f0dcff' },
    { name: 'Глубина', sky: ['#0f2e33', '#0a1f24', '#061214'], plat: ['#2e5a5a', '#204040', '#122626'], edge: 'rgba(140,255,240,.35)', star: '#7ff5e0', glow: 'rgba(120,240,220,.9)', sil: 'rgba(4,14,16,.85)', moon: 'rgba(190,255,245,.85)', accent: '#c8fff6' }
  ];

  var THEME_ADJ = ['Ночной', 'Алый', 'Ледяной', 'Забытый', 'Лунный', 'Древний', 'Тайный', 'Звёздный', 'Туманный', 'Хрустальный', 'Багровый', 'Изумрудный', 'Пепельный', 'Серебряный', 'Огненный', 'Тенистый', 'Медный', 'Лазурный', 'Полуночный', 'Заколдованный', 'Сумрачный', 'Зеркальный', 'Костяной', 'Ветряной'];
  var THEME_NOUN = ['замок', 'зал', 'лес', 'своды', 'башня', 'галерея', 'лабиринт', 'двор', 'колодец', 'переход', 'чертог', 'сад', 'мост', 'склеп', 'придел', 'ярус', 'коридор', 'амфитеатр', 'шпиль', 'грот', 'каскад', 'обрыв', 'предел', 'вихрь'];

  function hsl(h, s, l) { return 'hsl(' + h + ',' + s + '%,' + l + '%)'; }
  function hsla(h, s, l, a) { return 'hsla(' + h + ',' + s + '%,' + l + '%,' + a + ')'; }

  // every level gets its own palette and its own name
  function themeFor(lvl) {
    var r = seededRand(lvl * 2246822519 + 3266489917);
    var hue = Math.floor(r() * 360);
    var hue2 = (hue + 26 + Math.floor(r() * 70)) % 360;
    var sat = 26 + Math.floor(r() * 28);
    var light = 11 + Math.floor(r() * 9);
    var nameIdx = uniqueNameIndex(lvl);
    return {
      name: THEME_ADJ[nameIdx % THEME_ADJ.length] + ' ' + THEME_NOUN[Math.floor(nameIdx / THEME_ADJ.length)],
      sky: [hsl(hue, sat, light + 11), hsl(hue, sat, light + 4), hsl(hue, sat, Math.max(5, light - 5))],
      plat: [hsl(hue2, sat + 20, 36), hsl(hue2, sat + 16, 25), hsl(hue2, sat + 12, 14)],
      edge: hsla(hue2, 82, 74, 0.38),
      star: hsl((hue + 48) % 360, 88, 68),
      glow: hsla((hue + 48) % 360, 92, 62, 0.9),
      sil: hsla(hue, 52, 5, 0.86),
      moon: hsl((hue + 20) % 360, 38, 91),
      accent: hsl((hue + 48) % 360, 82, 83)
    };
  }

  // one name per level, no repeats: walk a deterministic permutation of all pairs
  var NAME_PERM = null;
  function uniqueNameIndex(lvl) {
    var total = THEME_ADJ.length * THEME_NOUN.length;
    if (!NAME_PERM) {
      var rr = seededRand(20241114);
      NAME_PERM = [];
      for (var i = 0; i < total; i++) NAME_PERM.push(i);
      for (var j = total - 1; j > 0; j--) {
        var k = Math.floor(rr() * (j + 1));
        var tmp = NAME_PERM[j];
        NAME_PERM[j] = NAME_PERM[k];
        NAME_PERM[k] = tmp;
      }
    }
    return NAME_PERM[(lvl - 1) % total];
  }

  // one level, one shape: parameters come from the level's own seed
  function generatedLayout(lvl) {
    var rnd = seededRand(lvl * 999983 + 7);
    var t = (lvl - 1) / (LEVEL_COUNT - 1);
    var world = Math.round(900 + t * 600 + rnd() * 140);
    var n = 8 + Math.floor(t * 6) + Math.floor(rnd() * 3);
    if (n < 8) n = 8;
    if (n > 15) n = 15;
    var step = (world - 210) / n;
    var climb = rnd() * 2 - 1;
    var waveAmp = 12 + rnd() * 74;
    var waveLen = 1.6 + rnd() * 3.4;
    var jitter = 6 + rnd() * 30;
    var yStart = 236 + Math.round(rnd() * 96);
    var narrow = 0.5 + rnd() * 0.8;
    var baseW = Math.max(54, (128 - t * 48) * narrow);
    var stair = rnd() < 0.4;

    var pts = [];
    var x = 92, y = yStart;
    for (var i = 0; i < n; i++) {
      pts.push({ x: Math.round(x), y: Math.round(y) });
      var dx = step + (rnd() - 0.5) * jitter * 2;
      var dy;
      if (stair) {
        dy = -(18 + rnd() * 34);
      } else {
        dy = -climb * 20 - Math.sin(i / waveLen * Math.PI) * waveAmp * 0.5 + (rnd() - 0.5) * jitter;
      }
      x += dx;
      y += dy;
      if (y < 82) y = 82;
      if (y > 352) y = 352;
    }

    var floaters = [];
    for (var p = 0; p < pts.length; p++) {
      var pw = Math.max(Math.round(baseW + (rnd() - 0.5) * 22), 50);
      var px = pts[p].x;
      if (px < 26) px = 26;
      if (px + pw > world - 26) px = world - 26 - pw;
      floaters.push({ x: px, y: pts[p].y, w: pw, h: 18 });
    }
    // no jump may be impossible
    for (var c = 1; c < floaters.length; c++) {
      var pa = floaters[c - 1], pb = floaters[c];
      var ca = pa.x + pa.w / 2, cb = pb.x + pb.w / 2;
      if (cb - ca > 188) {
        pb.x = Math.round(ca + 188 - pb.w / 2);
        if (pb.x + pb.w > world - 26) pb.x = world - 26 - pb.w;
      } else if (ca - cb > 188) {
        pb.x = Math.round(ca - 188 - pb.w / 2);
        if (pb.x < 26) pb.x = 26;
      }
      var va = pa.y - pb.y;
      if (va > 108) pb.y = pa.y - 108;
      if (va < -108) pb.y = pa.y + 108;
    }

    var gapA = Math.min(54 + lvl * 0.34, 128);
    var gapB = Math.min(44 + lvl * 0.40, 130);
    var g1 = { x: -40, y: 400, w: 200, h: 60 };
    var g2 = { x: Math.round(world * 0.44), y: 400, w: 180, h: 60 };
    var g3 = { x: world - 240, y: 400, w: 280, h: 60 };
    var platsArr = [g1, g2, g3];
    for (var k = 0; k < floaters.length; k++) platsArr.push(floaters[k]);

    // star spots: low over a slab, inside a single jump
    var cands = [];
    for (var ci = 0; ci < floaters.length; ci++) {
      var cp = floaters[ci];
      var xs = [cp.x + cp.w / 2, cp.x + 20, cp.x + cp.w - 20];
      var hs = [46, 58, 70, 84];
      for (var hi = 0; hi < hs.length; hi++) {
        for (var xi = 0; xi < xs.length; xi++) {
          var cx2 = Math.round(xs[xi]);
          var cy2 = Math.round(cp.y - hs[hi]);
          if (cy2 < 44 || cy2 > 392) continue;
          if (cx2 < 26 || cx2 > world - 26) continue;
          if (starHits(cx2, cy2, platsArr, 16)) continue;
          cands.push({ x: cx2, y: cy2 });
        }
      }
    }
    cands.sort(function (a, b) { return a.x - b.x; });
    var starsArr = [];
    var want = 5;
    var span = cands.length;
    for (var s = 0; s < want && span > 0; s++) {
      var target = Math.round(s * (span - 1) / (want - 1));
      var picked = null;
      for (var off = 0; off < span && !picked; off++) {
        var idxs = [target + off, target - off];
        for (var oi = 0; oi < 2; oi++) {
          var ix = idxs[oi];
          if (ix < 0 || ix >= span) continue;
          var c2 = cands[ix];
          var okd = true;
          for (var u = 0; u < starsArr.length; u++) {
            var ddx = c2.x - starsArr[u].x, ddy = c2.y - starsArr[u].y;
            if (ddx * ddx + ddy * ddy < 54 * 54) { okd = false; break; }
          }
          if (okd) { picked = c2; break; }
        }
      }
      if (!picked) {
        for (var oi2 = 0; oi2 < span; oi2++) {
          var c3 = cands[oi2], taken = false;
          for (var u2 = 0; u2 < starsArr.length; u2++) {
            if (c3.x === starsArr[u2].x && c3.y === starsArr[u2].y) { taken = true; break; }
          }
          if (!taken) { picked = c3; break; }
        }
      }
      if (picked) starsArr.push({ x: picked.x, y: picked.y, got: false });
    }
    for (var f = 0; starsArr.length < want && f < floaters.length; f++) {
      var fp2 = floaters[f];
      var fx = Math.round(fp2.x + fp2.w / 2), fy = Math.round(fp2.y - 52);
      var lift = 0;
      while (starHits(fx, fy, platsArr, 16) && lift < 12) { fy -= 10; lift++; }
      starsArr.push({ x: fx, y: Math.max(44, fy), got: false });
    }

    return {
      plats: platsArr,
      stars: starsArr,
      world: world,
      type: 0,
      theme: themeFor(lvl)
    };
  }

  // star must hang in free air: not inside any platform, clear of others
  function starHits(x, y, list, pad) {
    var r = 15 + (pad === undefined ? 12 : pad);
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      var nx = Math.max(p.x, Math.min(x, p.x + p.w));
      var ny = Math.max(p.y, Math.min(y, p.y + p.h));
      var dx = x - nx, dy = y - ny;
      if (dx * dx + dy * dy < r * r) return true;
    }
    return false;
  }

  function findStarSpot(fp, list, used) {
    var cx = Math.round(fp.x + fp.w / 2);
    var tries = [
      { x: cx, y: fp.y - 46 },
      { x: cx, y: fp.y - 64 },
      { x: cx, y: fp.y - 82 },
      { x: Math.round(fp.x + 24), y: fp.y - 48 },
      { x: Math.round(fp.x + fp.w - 24), y: fp.y - 48 },
      { x: cx, y: fp.y + 58 },
      { x: cx, y: fp.y + 78 }
    ];
    for (var i = 0; i < tries.length; i++) {
      var c = tries[i];
      if (c.y < 40 || c.y > 392) continue;
      if (starHits(c.x, c.y, list)) continue;
      var clash = false;
      for (var u = 0; u < used.length; u++) {
        var dx = c.x - used[u].x, dy = c.y - used[u].y;
        if (dx * dx + dy * dy < 60 * 60) { clash = true; break; }
      }
      if (clash) continue;
      return { x: c.x, y: c.y };
    }
    // last resort: hover high above, nudged sideways until free
    for (var k = 1; k <= 14; k++) {
      var yy = fp.y - 50 - k * 14;
      if (yy < 46) break;
      for (var dxs = 0; dxs <= 3; dxs++) {
        var xx = cx + (dxs === 0 ? 0 : (dxs % 2 ? 1 : -1) * Math.ceil(dxs / 2) * 34);
        if (starHits(xx, yy, list)) continue;
        var far = true;
        for (var u2 = 0; u2 < used.length; u2++) {
          var ddx = xx - used[u2].x, ddy = yy - used[u2].y;
          if (ddx * ddx + ddy * ddy < 46 * 46) { far = false; break; }
        }
        if (far) return { x: xx, y: yy };
      }
    }
    return { x: cx, y: Math.max(48, fp.y - 52) };
  }

  function saveProgress() {
    try {
      localStorage.setItem('hat_level', String(level));
      localStorage.setItem('hat_max', String(maxUnlocked));
    } catch (e) {}
  }

  function makeLevel(idx) {
    if (typeof idx === 'number') {
      if (idx < 1) idx = 1;
      if (idx > LEVEL_COUNT) idx = LEVEL_COUNT;
      level = idx;
    }
    var layout;
    if (level === 1) {
      layout = levelOneLayout();
      WORLD = 940;
      layout.type = 0;
      layout.theme = THEMES[0];
    } else {
      layout = generatedLayout(level);
      WORLD = layout.world;
    }
    plats = layout.plats;
    stars = layout.stars;
    theme = layout.theme || THEMES[0];
    player = { x: 60, y: 300, w: 30, h: 38, vx: 0, vy: 0, onGround: false, face: 1 };
    score = 0;
    win = false;
    t = 0;
    camX = 0;
    jumpBuf = 0;
    jumpWasDown = false;
    jumpCutDone = false;
    coyote = 0;
    updateScore();
    saveProgress();
  }

  function goNextLevel() {
    if (level < LEVEL_COUNT && level < maxUnlocked + 1) {
      makeLevel(level + 1);
    } else if (level < LEVEL_COUNT && win) {
      makeLevel(level + 1);
    } else if (win && level === LEVEL_COUNT) {
      // all done, stay
    } else {
      makeLevel(level);
    }
  }

  function goPrevLevel() {
    if (level > 1) makeLevel(level - 1);
  }

  function onWinLevel() {
    if (level < LEVEL_COUNT && level + 1 > maxUnlocked) {
      maxUnlocked = level + 1;
    }
    saveProgress();
  }

  function updateScore() {
    scoreEl.textContent = 'Ур. ' + level + '/' + LEVEL_COUNT + ' · ' + ((theme && theme.name) || '') + ' · Звёзды: ' + score + ' / 5';
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  /* ---------- input ---------- */
  document.addEventListener('keydown', function (e) {
    var k = e.code;
    if (k === 'ArrowLeft' || k === 'KeyA') keys.left = true;
    if (k === 'ArrowRight' || k === 'KeyD') keys.right = true;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') { keys.jump = true; e.preventDefault(); }
    if (k === 'KeyR') makeLevel(level);
    if (k === 'KeyN' || k === 'Enter') { if (win || level < maxUnlocked) goNextLevel(); }
    if (k === 'KeyP') goPrevLevel();
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k) >= 0) e.preventDefault();
  });
  document.addEventListener('keyup', function (e) {
    var k = e.code;
    if (k === 'ArrowLeft' || k === 'KeyA') keys.left = false;
    if (k === 'ArrowRight' || k === 'KeyD') keys.right = false;
    if (k === 'Space' || k === 'ArrowUp' || k === 'KeyW') keys.jump = false;
  });

  /* ---------- touch joystick ---------- */
  var pad = document.getElementById('pad');
  var knob = document.getElementById('knob');
  var jumpBtn = document.getElementById('jumpBtn');
  var padId = null;
  var axis = 0;

  function isTouch() {
    return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  }
  if (isTouch()) document.body.classList.add('touch');

  function setKnob(dx, dy) {
    knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }

  function padMove(e) {
    var r = pad.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    var dx = e.clientX - cx;
    var dy = e.clientY - cy;
    var max = r.width * 0.34;
    var dist = Math.sqrt(dx * dx + dy * dy) || 1;
    if (dist > max) { dx = dx / dist * max; dy = dy / dist * max; }
    setKnob(dx, dy);
    axis = Math.max(-1, Math.min(1, dx / max));
  }

  function endPad() {
    padId = null; axis = 0; setKnob(0, 0);
  }

  pad.addEventListener('touchstart', function (e) {
    e.preventDefault();
    padId = e.changedTouches[0].identifier;
    padMove(e.changedTouches[0]);
  }, { passive: false });
  pad.addEventListener('touchmove', function (e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === padId) padMove(e.changedTouches[i]);
    }
  }, { passive: false });
  pad.addEventListener('touchend', function (e) { endPad(); }, { passive: false });
  pad.addEventListener('touchcancel', function (e) { endPad(); }, { passive: false });

  jumpBtn.addEventListener('touchstart', function (e) {
    e.preventDefault(); keys.jump = true;
  }, { passive: false });
  jumpBtn.addEventListener('touchend', function (e) {
    e.preventDefault(); keys.jump = false;
  }, { passive: false });

  /* tap on canvas to restart after win */
  canvas.addEventListener('pointerdown', function () {
    if (win) goNextLevel();
  });

  /* ---------- physics ---------- */
  function update() {
    t++;
    var dir = 0;
    if (keys.left) dir -= 1;
    if (keys.right) dir += 1;
    if (Math.abs(axis) > 0.18) dir = axis;

    player.vx += dir * MOVE;
    if (Math.abs(player.vx) > MAXSPEED) player.vx = MAXSPEED * Math.sign(player.vx);
    if (dir === 0) {
      player.vx *= FRICTION;
      if (Math.abs(player.vx) < 0.08) player.vx = 0;
    }
    if (dir !== 0) player.face = dir > 0 ? 1 : -1;

    player.vy += GRAV;
    if (player.vy > MAXFALL) player.vy = MAXFALL;

    // jump intent: edge-triggered, buffered, with coyote time
    var jumpDown = !!keys.jump;
    if (jumpDown && !jumpWasDown) jumpBuf = 8;
    jumpWasDown = jumpDown;
    if (jumpBuf > 0) jumpBuf--;
    if (player.onGround) coyote = 6; else if (coyote > 0) coyote--;

    // horizontal
    player.x += player.vx;
    for (var i = 0; i < plats.length; i++) {
      var p = plats[i];
      if (rectsOverlap(player, p)) {
        if (player.vx > 0) player.x = p.x - player.w;
        else if (player.vx < 0) player.x = p.x + p.w;
        player.vx = 0;
      }
    }

    // vertical
    player.y += player.vy;
    player.onGround = false;
    for (var j = 0; j < plats.length; j++) {
      var q = plats[j];
      if (rectsOverlap(player, q)) {
        if (player.vy > 0) {
          player.y = q.y - player.h;
          player.vy = 0;
          player.onGround = true;
        } else if (player.vy < 0) {
          player.y = q.y + q.h;
          player.vy = 0;
        }
      }
    }

    if (jumpBuf > 0 && (player.onGround || coyote > 0)) {
      player.vy = JUMP;
      player.onGround = false;
      coyote = 0;
      jumpBuf = 0;
      jumpCutDone = false;
    }
    // variable jump height: cut once when the button is released while rising
    if (!jumpDown && player.vy < -4 && !jumpCutDone) {
      player.vy *= 0.55;
      jumpCutDone = true;
    }
    if (player.onGround) jumpCutDone = false;

    // world bounds
    if (player.x < -30) { player.x = -30; player.vx = 0; }
    if (player.x + player.w > WORLD) { player.x = WORLD - player.w; player.vx = 0; }
    if (player.y > H + 120) { // fell into a gap
      makeLevel(level);
      return;
    }

    // stars
    for (var s = 0; s < stars.length; s++) {
      var st = stars[s];
      if (!st.got) {
        var box = { x: st.x - 14, y: st.y - 14, w: 28, h: 28 };
        if (rectsOverlap(player, box)) {
          st.got = true;
          score++;
          updateScore();
          if (score >= stars.length) { win = true; onWinLevel(); updateScore(); }
        }
      }
    }

    // camera
    var target = Math.max(0, Math.min(WORLD - W, player.x + player.w / 2 - W / 2));
    camX += (target - camX) * 0.12;
  }

  /* ---------- drawing ---------- */
  function drawBg() {
    var th = theme || THEMES[0];
    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky[0]);
    g.addColorStop(0.55, th.sky[1]);
    g.addColorStop(1, th.sky[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // stars in the sky (parallax)
    ctx.fillStyle = th.moon;
    ctx.globalAlpha = 0.55;
    for (var i = 0; i < 60; i++) {
      var sx = ((i * 137 + 40) - camX * 0.15) % (W + 40);
      if (sx < 0) sx += W + 40;
      var sy = (i * 71) % 240;
      var r = (i % 3 === 0) ? 1.6 : 0.9;
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // castle silhouette
    ctx.fillStyle = th.sil;
    var off = -camX * 0.3;
    ctx.beginPath();
    ctx.moveTo(0, H);
    ctx.lineTo(0, 300);
    ctx.lineTo(60 + off, 300);
    ctx.lineTo(60 + off, 250);
    ctx.lineTo(90 + off, 250);
    ctx.lineTo(90 + off, 300);
    ctx.lineTo(170 + off, 300);
    ctx.lineTo(170 + off, 200);
    ctx.lineTo(210 + off, 200);
    ctx.lineTo(210 + off, 300);
    ctx.lineTo(300 + off, 300);
    ctx.lineTo(300 + off, 265);
    ctx.lineTo(340 + off, 265);
    ctx.lineTo(340 + off, 300);
    ctx.lineTo(W, 300);
    ctx.lineTo(W, H);
    ctx.closePath();
    ctx.fill();

    // moon
    ctx.fillStyle = th.moon;
    ctx.beginPath();
    ctx.arc(680, 74, 34, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 0.14;
    ctx.beginPath();
    ctx.arc(680, 74, 52, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawPlats() {
    var th = theme || THEMES[0];
    for (var i = 0; i < plats.length; i++) {
      var p = plats[i];
      var x = p.x - camX;
      if (x > W + 60 || x + p.w < -60) continue;

      var g = ctx.createLinearGradient(0, p.y, 0, p.y + p.h);
      g.addColorStop(0, th.plat[0]);
      g.addColorStop(0.25, th.plat[1]);
      g.addColorStop(1, th.plat[2]);
      ctx.fillStyle = g;
      roundRect(x, p.y, p.w, p.h, 5);
      ctx.fill();

      ctx.strokeStyle = th.edge;
      ctx.lineWidth = 2;
      roundRect(x, p.y, p.w, p.h, 5);
      ctx.stroke();

      // stone bricks
      ctx.strokeStyle = 'rgba(0,0,0,.22)';
      ctx.lineWidth = 1;
      for (var bx = x + 26; bx < x + p.w - 6; bx += 26) {
        ctx.beginPath();
        ctx.moveTo(bx, p.y + 2);
        ctx.lineTo(bx, p.y + p.h - 2);
        ctx.stroke();
      }
    }
  }

  function drawStar(st) {
    var x = st.x - camX, y = st.y;
    var bob = Math.sin((t + st.x) * 0.06) * 3;
    ctx.save();
    ctx.translate(x, y + bob);
    ctx.rotate(Math.sin((t + st.x) * 0.02) * 0.18);
    ctx.shadowColor = (theme || THEMES[0]).glow;
    ctx.shadowBlur = 16;
    ctx.fillStyle = (theme || THEMES[0]).star;
    ctx.beginPath();
    for (var i = 0; i < 5; i++) {
      var a1 = -Math.PI / 2 + i * (Math.PI * 2 / 5);
      var a2 = a1 + Math.PI / 5;
      ctx.lineTo(Math.cos(a1) * 13, Math.sin(a1) * 13);
      ctx.lineTo(Math.cos(a2) * 5.5, Math.sin(a2) * 5.5);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawPlayer() {
    var x = player.x - camX;
    var y = player.y;
    var w = player.w, h = player.h;
    var squash = player.onGround ? 1 : 0.94;

    ctx.save();
    ctx.translate(x + w / 2, y + h);
    ctx.scale(player.face, 1);

    // shadow
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.beginPath();
    ctx.ellipse(0, 2, w * 0.52, 5, 0, 0, Math.PI * 2);
    ctx.fill();

    // cloak / body
    var bg = ctx.createLinearGradient(0, -h, 0, 0);
    bg.addColorStop(0, '#8e1c24');
    bg.addColorStop(1, '#3d0a10');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(-w * 0.42, 0);
    ctx.lineTo(-w * 0.30, -h * 0.55 * squash);
    ctx.lineTo(w * 0.30, -h * 0.55 * squash);
    ctx.lineTo(w * 0.42, 0);
    ctx.closePath();
    ctx.fill();

    // wizard hat
    ctx.fillStyle = '#2b2b4a';
    ctx.beginPath();
    ctx.moveTo(-w * 0.52, -h * 0.52 * squash);
    ctx.lineTo(w * 0.52, -h * 0.52 * squash);
    ctx.lineTo(0, -h * 1.05 * squash);
    ctx.closePath();
    ctx.fill();

    // hat brim
    ctx.fillStyle = '#1b1b33';
    ctx.beginPath();
    ctx.ellipse(0, -h * 0.52 * squash, w * 0.56, h * 0.10, 0, 0, Math.PI * 2);
    ctx.fill();

    // hat band
    ctx.fillStyle = '#c9a227';
    ctx.fillRect(-w * 0.30, -h * 0.63 * squash, w * 0.60, h * 0.07);

    // eyes
    ctx.fillStyle = '#fff2c4';
    ctx.beginPath();
    ctx.arc(-6, -h * 0.40 * squash, 2.6, 0, Math.PI * 2);
    ctx.arc(4, -h * 0.40 * squash, 2.6, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawWin() {
    ctx.fillStyle = 'rgba(8,6,20,.72)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.fillStyle = (theme || THEMES[0]).accent;
    ctx.shadowColor = (theme || THEMES[0]).glow;
    ctx.shadowBlur = 22;
    ctx.font = 'bold 36px Georgia, serif';
    ctx.fillText('Уровень ' + level + ' пройден!', W / 2, H / 2 - 30);
    ctx.shadowBlur = 0;
    ctx.font = '20px Georgia, serif';
    ctx.fillStyle = 'rgba(244,233,200,.85)';
    if (level >= LEVEL_COUNT) {
      ctx.fillText('Все 200 уровней пройдены. Факультет гордится тобой!', W / 2, H / 2 + 8);
      ctx.fillText('R — сыграть вновь', W / 2, H / 2 + 38);
    } else {
      ctx.fillText('Все 5 звёзд собраны. Тап / Enter — уровень ' + (level + 1), W / 2, H / 2 + 8);
      ctx.fillText('R — заново · P — назад', W / 2, H / 2 + 38);
    }
    ctx.textAlign = 'left';
  }

  function render() {
    drawBg();
    drawPlats();
    for (var i = 0; i < stars.length; i++) {
      if (!stars[i].got) drawStar(stars[i]);
    }
    drawPlayer();
    if (win) drawWin();
  }

  function loop() {
    if (!win) update();
    else t++;
    render();
    requestAnimationFrame(loop);
  }

  try {
    window.__hat = {
      get level() { return level; },
      get maxUnlocked() { return maxUnlocked; },
      get world() { return WORLD; },
      get starCount() { return stars ? stars.length : 0; },
      makeLevel: makeLevel,
      goNextLevel: goNextLevel,
      goPrevLevel: goPrevLevel
    };
  } catch (e) {}
  makeLevel(level);
  loop();
  // touch swipe left/right on win screen = prev/next level
  (function () {
    var sx = null;
    canvas.addEventListener('touchstart', function (e) {
      if (e.changedTouches && e.changedTouches[0]) sx = e.changedTouches[0].clientX;
    }, { passive: true });
    canvas.addEventListener('touchend', function (e) {
      if (sx === null || !win) return;
      var dx = 0;
      if (e.changedTouches && e.changedTouches[0]) dx = e.changedTouches[0].clientX - sx;
      sx = null;
      if (Math.abs(dx) > 40) { if (dx < 0) goNextLevel(); else goPrevLevel(); }
    }, { passive: true });
  })();
})();
</script>
</body>
</html>
